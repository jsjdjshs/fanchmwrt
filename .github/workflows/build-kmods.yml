name: Build FanchmWrt USB driver firmware
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          repository: fanchmwrt/fanchmwrt
          ref: fanchmwrt-25.12.4
          fetch-depth: 1

      - name: Free disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost 2>/dev/null || true
          df -h /

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get -y install build-essential clang flex bison g++ gawk \
            gettext git libncurses-dev libssl-dev python3-setuptools rsync \
            swig unzip zlib1g-dev file wget

      - name: Fetch feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure device and USB drivers
        run: |
          printf '%s\n' CONFIG_TARGET_ramips=y CONFIG_TARGET_ramips_mt7621=y \
            CONFIG_TARGET_ramips_mt7621_DEVICE_jdcloud_re-sp-01b=y > .config
          make defconfig
          printf '%s\n' \
            CONFIG_PACKAGE_kmod-mii=y \
            CONFIG_PACKAGE_kmod-usb-acm=y \
            CONFIG_PACKAGE_kmod-usb-net=y \
            CONFIG_PACKAGE_kmod-usb-net-cdc-ether=y \
            CONFIG_PACKAGE_kmod-usb-net-cdc-mbim=y \
            CONFIG_PACKAGE_kmod-usb-net-cdc-ncm=y \
            CONFIG_PACKAGE_kmod-usb-net-huawei-cdc-ncm=y \
            CONFIG_PACKAGE_kmod-usb-net-qmi-wwan=y \
            CONFIG_PACKAGE_kmod-usb-net-rndis=y \
            CONFIG_PACKAGE_kmod-usb-net-rtl8152=y \
            CONFIG_PACKAGE_kmod-usb-serial=y \
            CONFIG_PACKAGE_kmod-usb-serial-option=y \
            CONFIG_PACKAGE_kmod-usb-serial-wwan=y \
            CONFIG_PACKAGE_kmod-usb-wdm=y >> .config
          make defconfig
          echo "=== device ==="
          grep -E '^CONFIG_TARGET_ramips_mt7621=|^CONFIG_TARGET_ramips_mt7621_DEVICE_jdcloud_re-sp-01b=' .config
          echo "=== selected USB driver packages ==="
          grep '^CONFIG_PACKAGE_kmod-usb\|^CONFIG_PACKAGE_kmod-mii' .config

      - name: Build firmware
        run: make -j"$(nproc)" BUILD_LOG=1

      - name: Verify image and collect metadata
        run: |
          set -eu
          mkdir -p out
          IMAGE=$(find bin/targets/ramips/mt7621 -maxdepth 1 \
            -type f -name '*jdcloud_re-sp-01b*squashfs-sysupgrade.bin' -print -quit)
          test -n "$IMAGE"
          cp "$IMAGE" out/
          SIZE=$(stat -c %s "$IMAGE")
          LIMIT=$((27328 * 1024))
          echo "Image: $(basename "$IMAGE")"
          echo "Size: $SIZE bytes; device image limit: $LIMIT bytes"
          test "$SIZE" -le "$LIMIT"
          sha256sum out/*.bin | tee out/SHA256SUMS
          echo "Kernel ABI package:"
          find bin/targets/ramips/mt7621/packages -maxdepth 1 -name 'kernel-*.apk' -printf '%f\n' | tee out/kernel-abi.txt
          echo "USB package names selected in image config:"
          grep -E '^CONFIG_PACKAGE_(kmod-mii|kmod-usb-.*)=y' .config | sort | tee out/usb-packages.txt
          echo "No files/ overlay was added; no network, wireless, or firewall settings are embedded."

      - uses: actions/upload-artifact@v4
        with:
          name: fanchmwrt-re-sp-01b-usb-drivers-sysupgrade
          if-no-files-found: error
          retention-days: 30
          path: out/
