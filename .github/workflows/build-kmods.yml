name: Build USB dongle driver packages
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          repository: fanchmwrt/fanchmwrt
          ref: fanchmwrt-25.12.4
          fetch-depth: 1

      - name: Free disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost 2>/dev/null || true
          df -h /

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get -y install build-essential clang flex bison g++ gawk \
            gettext git libncurses-dev libssl-dev python3-setuptools rsync \
            swig unzip zlib1g-dev file wget

      - name: Fetch feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure driver packages only
        run: |
          printf '%s\n' CONFIG_TARGET_ramips=y CONFIG_TARGET_ramips_mt7621=y \
            CONFIG_TARGET_ramips_mt7621_DEVICE_jdcloud_re-sp-01b=y > .config
          make defconfig
          printf '%s\n' \
            CONFIG_PACKAGE_kmod-mii=y \
            CONFIG_PACKAGE_kmod-usb-acm=y \
            CONFIG_PACKAGE_kmod-usb-net=y \
            CONFIG_PACKAGE_kmod-usb-net-cdc-ether=y \
            CONFIG_PACKAGE_kmod-usb-net-cdc-mbim=y \
            CONFIG_PACKAGE_kmod-usb-net-cdc-ncm=y \
            CONFIG_PACKAGE_kmod-usb-net-huawei-cdc-ncm=y \
            CONFIG_PACKAGE_kmod-usb-net-qmi-wwan=y \
            CONFIG_PACKAGE_kmod-usb-net-rndis=y \
            CONFIG_PACKAGE_kmod-usb-net-rtl8152=y \
            CONFIG_PACKAGE_kmod-usb-serial=y \
            CONFIG_PACKAGE_kmod-usb-serial-option=y \
            CONFIG_PACKAGE_kmod-usb-serial-wwan=y \
            CONFIG_PACKAGE_kmod-usb-wdm=y \
            CONFIG_PACKAGE_usb-modeswitch=y >> .config
          make defconfig
          grep -E 'DEVICE_jdcloud|CONFIG_TARGET_ramips_mt7621=' .config
          echo "=== selected USB driver packages ==="
          grep '^CONFIG_PACKAGE_kmod-usb\|^CONFIG_PACKAGE_kmod-mii\|^CONFIG_PACKAGE_usb-modeswitch' .config

      - name: Build tools
        run: make -j"$(nproc)" tools/install

      - name: Build toolchain
        run: make -j"$(nproc)" toolchain/install

      - name: Build kernel
        run: make -j"$(nproc)" target/linux/compile

      - name: Build driver packages
        run: |
          make -j"$(nproc)" package/kernel/linux/compile
          make -j"$(nproc)" package/feeds/packages/usb-modeswitch/compile

      - name: Collect USB packages only
        run: |
          mkdir -p out/targets out/base
          cp bin/targets/ramips/mt7621/packages/kernel-*.apk out/targets/
          cp bin/targets/ramips/mt7621/packages/kmod-mii-*.apk out/targets/
          cp bin/targets/ramips/mt7621/packages/kmod-usb-*.apk out/targets/
          find bin/packages/mipsel_24kc -type f -name 'usb-modeswitch-*.apk' \
            -exec cp {} out/base/ \; 2>/dev/null || true
          echo "=== package list (USB drivers and required kernel ABI only) ==="
          find out -type f -name '*.apk' -printf '%f\n' | sort
          echo "=== kernel ABI ==="
          find out/targets -maxdepth 1 -name 'kernel-*.apk' -printf '%f\n'

      - uses: actions/upload-artifact@v4
        with:
          name: usb-driver-packages-only
          if-no-files-found: error
          retention-days: 30
          path: out/
